name: Original-base non-thinking native image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agenthon-nonthinking-base-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -B ci/verify_manifest.py
      - name: Build remote overlay over pinned original base before registry login
        run: docker build --network none --platform linux/amd64 --tag agenthon-nonthinking:tested --file ci/nonthinking.Dockerfile .
      - name: Actual image native protocol and original-CLI checks
        run: |
          set -euo pipefail
          timeout 60 docker run --rm --name agenthon-nonthinking-tests --pull never --platform linux/amd64 \
            --network none --read-only --user 65534:65534 --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --cpus 2 \
            --memory 2g --memory-swap 2g --ulimit nofile=1024:1024 --ulimit nproc=256:256 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --env PYTHONDONTWRITEBYTECODE=1 --env QFBENCH_NETWORK=none \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/validation,readonly" \
            --entrypoint python agenthon-nonthinking:tested /validation/ci/test_nonthinking_image.py | tee nonthinking-test.log
      - name: Publish only tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/agenthon-nonthinking-docker-auth"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image_ref="ghcr.io/he-yufeng/agenthon-t1-agent:nonthinking-base-$GITHUB_SHA"
          docker tag agenthon-nonthinking:tested "$image_ref"
          docker push "$image_ref" | tee publish.log
          docker image inspect "$image_ref" > image-inspect.json
          python3 -B ci/record_nonthinking_release.py
          docker logout ghcr.io
      - name: Report actual evidence
        if: always()
        run: |
          if test -f nonthinking-release-receipt.json; then cat nonthinking-release-receipt.json; fi
          if test -f nonthinking-test.log; then grep '^NONTHINKING_TEST_RESULT=' nonthinking-test.log >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Clean only owned test container
        if: always()
        run: docker rm --force agenthon-nonthinking-tests 2>/dev/null || true
