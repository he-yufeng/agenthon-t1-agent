name: Review candidate native validation and GHCR image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agenthon-review-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify source manifest
        run: python3 ci/verify_manifest.py
      - name: Build remote-only review overlay on frozen base
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          docker build --network none --platform linux/amd64 --tag agenthon-review:tested --file ci/review.Dockerfile .
      - name: Test actual image under reduced runtime limits
        run: |
          set -euo pipefail
          timeout 60 docker run --rm --name agenthon-review-tests --pull never --platform linux/amd64 \
            --network none --read-only --user 65534:65534 --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --cpus 2 \
            --memory 2g --memory-swap 2g --ulimit nofile=1024:1024 --ulimit nproc=256:256 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --env PYTHONDONTWRITEBYTECODE=1 --env QFBENCH_NETWORK=none \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/validation,readonly" \
            --entrypoint python agenthon-review:tested /validation/ci/test_review_image.py | tee review-test.log
      - name: Publish the verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/agenthon-docker-auth"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image_ref="ghcr.io/he-yufeng/agenthon-t1-agent:review-$GITHUB_SHA"
          docker tag agenthon-review:tested "$image_ref"
          docker push "$image_ref" | tee publish.log
          docker image inspect "$image_ref" > image-inspect.json
          python3 ci/record_review_release.py
          docker logout ghcr.io
      - name: Release evidence
        if: always()
        run: |
          if test -f review-release-receipt.json; then cat review-release-receipt.json; fi
          if test -f review-test.log; then grep '^REVIEW_TEST_RESULT=' review-test.log >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Cleanup owned test container
        if: always()
        run: docker rm --force agenthon-review-tests 2>/dev/null || true
