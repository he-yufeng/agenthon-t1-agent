name: R05 bounded input context native validation
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agenthon-dev-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout unique candidate source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify original engine and candidate manifest
        run: python3 ci/derive_input_context_r05.py --verify
      - name: Build overlay on the exact original public image
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          docker build --platform linux/amd64 --tag agenthon-r05:tested --file ci/input_context_r05.Dockerfile .
          r05_volumes_json="$(docker image inspect agenthon-r05:tested --format '{{json .Config.Volumes}}')"
          test "$r05_volumes_json" = null || test "$r05_volumes_json" = '{}'
          echo R05_FINAL_INHERITED_VOLUME_GATE_PASS
      - name: Mandatory actual-image 29 tests and CLI under reduced runtime limits
        run: |
          set -euo pipefail
          timeout 180 docker run --rm --name agenthon-r05-native-tests --pull never --platform linux/amd64 \
            --network none --read-only --user 65534:65534 --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --cpus 2 \
            --memory 2g --memory-swap 2g --ulimit nofile=1024:1024 --ulimit nproc=256:256 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --env PYTHONDONTWRITEBYTECODE=1 --env QFBENCH_NETWORK=none \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/validation,readonly" \
            --entrypoint python agenthon-r05:tested /validation/ci/test_input_context_r05_image.py | tee native-r05.log
      - name: Publish only the validated unique candidate tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/agenthon-r05-docker-auth"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          r05_image_ref="ghcr.io/he-yufeng/agenthon-t1-agent:r05-input-context-$GITHUB_SHA"
          docker tag agenthon-r05:tested "$r05_image_ref"
          docker push "$r05_image_ref" | tee publish-r05.log
          docker image inspect "$r05_image_ref" > image-inspect-r05.json
          python3 ci/record_input_context_r05.py
          docker logout ghcr.io
      - name: Emit only owned-source admission evidence
        if: always()
        run: |
          if test -f native-r05.log; then sed -n '/^NATIVE_R05_RESULT=/p' native-r05.log >> "$GITHUB_STEP_SUMMARY"; fi
          if test -f r05-release-receipt.json; then python3 -m json.tool r05-release-receipt.json; fi
      - name: Cleanup only this job's owned test container
        if: always()
        run: docker rm --force agenthon-r05-native-tests 2>/dev/null || true
