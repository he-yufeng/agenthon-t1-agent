name: Native R04 path composition image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agenthon-r04-path-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify source manifest
        run: python3 -B ci/verify_manifest.py
      - name: Build immutable-base core overlay
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          timeout 300 docker build --platform linux/amd64 --tag agenthon-r04:tested --file ci/path_join_r04.Dockerfile .
      - name: Test actual image under reduced runtime limits
        run: |
          set -euo pipefail
          timeout 180 docker run --rm --name "agenthon-r04-tests-$GITHUB_RUN_ID" --pull never --platform linux/amd64 \
            --network none --read-only --user 65534:65534 --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --cpus 2 \
            --memory 2g --memory-swap 2g --ulimit nofile=1024:1024 --ulimit nproc=256:256 \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --env PYTHONDONTWRITEBYTECODE=1 --env QFBENCH_NETWORK=none \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/validation,readonly" \
            --entrypoint python agenthon-r04:tested /validation/ci/test_image.py | tee native-test.log
      - name: Publish the verified image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/agenthon-r04-docker-auth"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image_ref="ghcr.io/he-yufeng/agenthon-t1-agent:r04-path-join-$GITHUB_SHA"
          docker tag agenthon-r04:tested "$image_ref"
          timeout 180 docker push "$image_ref" | tee publish.log
          docker image inspect "$image_ref" > image-inspect.json
          python3 -B ci/record_release.py
          docker logout ghcr.io
      - name: Release evidence
        if: always()
        run: |
          if test -f release-receipt.json; then cat release-receipt.json; fi
          if test -f native-test.log; then grep '^NATIVE_TEST_RESULT=' native-test.log >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Cleanup owned test container
        if: always()
        run: docker rm --force "agenthon-r04-tests-$GITHUB_RUN_ID" 2>/dev/null || true
